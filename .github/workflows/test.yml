name: Compatibilidad
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        discord: ['13.17.1', '14.28.1', '15.0.0-dev.1795176133-cd7400323']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Probar la instalación con el nombre del paquete original
        run: |
          archive=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --ignore-scripts "discord.js@${{ matrix.discord }}" "discord-html-transcripts@file:$RUNNER_TEMP/$archive"
          node "$GITHUB_WORKSPACE/test/sdk.cjs"
